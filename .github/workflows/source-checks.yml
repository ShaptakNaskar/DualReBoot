name: Source and build-tool checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject binary payloads and signing material
        run: python3 scripts/check_source_only.py
      - name: Test input validation and compatibility patches
        run: python3 -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python3 -m py_compile scripts/*.py tests/*.py port/embed.py
      - name: Test reconstructed native math without proprietary inputs
        run: |
          c++ -std=c++17 -O2 -ffp-contract=off -Iport port/native_math.cpp tests/native_math_unit.cpp -o "$RUNNER_TEMP/native-math-unit"
          "$RUNNER_TEMP/native-math-unit"
      - name: Test native asset loader without proprietary inputs
        run: |
          cmake -S native-port -B build/native-port-ci -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-port-ci
          ctest --test-dir build/native-port-ci --output-on-failure
